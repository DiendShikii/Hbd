<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hbd</title>

  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="stage show" id="cakeStage">
    <div class="room-glow"></div>

    <svg id="cake" viewBox="0 0 400 460">

      <defs>
        <radialGradient id="g">
          <stop offset="0" stop-color="#ffd45a" stop-opacity=".8" />
          <stop offset="1" stop-color="#ffd45a" stop-opacity="0" />
        </radialGradient>

        <pattern id="st" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
          <rect width="16" height="16" fill="#fff" />
          <rect width="16" height="8" fill="#e0453a" />
        </pattern>

        <linearGradient id="choc" x1="0" x2="1">
          <stop offset="0" stop-color="#4e2a17" />
          <stop offset=".5" stop-color="#7a4328" />
          <stop offset="1" stop-color="#4e2a17" />
        </linearGradient>

        <!-- Api realistis -->
        <linearGradient id="fOut" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#ff6a00" stop-opacity=".9" />
          <stop offset=".55" stop-color="#ffa81f" />
          <stop offset="1"   stop-color="#ffd85a" />
        </linearGradient>
        <linearGradient id="fIn" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe27a" />
          <stop offset="1" stop-color="#fffbe6" />
        </linearGradient>
        <radialGradient id="eg">
          <stop offset="0" stop-color="#ff7a2a" stop-opacity=".9" />
          <stop offset="1" stop-color="#ff4a10" stop-opacity="0" />
        </radialGradient>
        <filter id="fBlur" x="-60%" y="-30%" width="220%" height="160%">
          <feGaussianBlur stdDeviation=".8" />
        </filter>
        <filter id="smokeBlur" x="-250%" y="-250%" width="600%" height="600%">
          <feGaussianBlur stdDeviation="2.4" />
        </filter>
      </defs>

      <!-- Piring -->
      <ellipse cx="200" cy="437" rx="75"  ry="9"  fill="#cfc2aa" />
      <ellipse cx="200" cy="420" rx="185" ry="26" fill="#d9cdb8" />
      <ellipse cx="200" cy="413" rx="185" ry="26" fill="#f1e9db" />
      <ellipse cx="200" cy="413" rx="152" ry="19" fill="#f8f2e6" stroke="#e2d7c2" stroke-width="2" />

      <!-- Tingkat bawah -->
      <path d="M50 300V385Q50 418 200 418Q350 418 350 385V300Z" fill="url(#choc)" />
      <ellipse cx="200" cy="300" rx="150" ry="32" fill="#fff4dc" />
      <path fill="#fff4dc"
        d="M50 300H350V322Q333 352 316 322Q299 300 282 322Q265 350 248 322
           Q231 300 214 322Q197 350 180 322Q163 300 146 322Q129 350 112 322
           Q95 300 78 322Q64 344 50 322Z" />

      <!-- Wajah -->
      <g fill="#2a1409">
        <circle cx="150" cy="372" r="9" />
        <circle cx="250" cy="372" r="9" />
      </g>
      <path d="M180 385Q200 402 220 385" stroke="#2a1409" stroke-width="5" fill="none" stroke-linecap="round" />

      <!-- Taburan bawah -->
      <g fill="#f3a8b5">
        <rect x="90"  y="298" width="14" height="6" rx="3" transform="rotate(-25 97 301)" />
        <rect x="150" y="312" width="14" height="6" rx="3" transform="rotate(20 157 315)" />
        <rect x="230" y="300" width="14" height="6" rx="3" transform="rotate(-10 237 303)" />
        <rect x="290" y="310" width="14" height="6" rx="3" transform="rotate(35 297 313)" />
        <rect x="195" y="318" width="14" height="6" rx="3" />
      </g>

      <!-- Tingkat atas -->
      <path d="M110 200V262Q110 288 200 288Q290 288 290 262V200Z" fill="url(#choc)" />
      <ellipse cx="200" cy="200" rx="90" ry="22" fill="#fff4dc" />
      <path fill="#fff4dc"
        d="M110 200H290V218Q278 240 266 218Q254 204 242 220Q230 242 218 220
           Q206 204 194 220Q182 242 170 220Q158 204 146 220Q134 240 122 218
           Q116 212 110 218Z" />

      <!-- Taburan atas -->
      <g fill="#e07a8c">
        <rect x="130" y="196" width="12" height="5" rx="2.5" transform="rotate(-20 136 198)" />
        <rect x="225" y="203" width="12" height="5" rx="2.5" transform="rotate(25 231 205)" />
        <rect x="262" y="196" width="12" height="5" rx="2.5" />
      </g>

      <!-- Lilin -->
      <g id="candles">

        <!-- Cahaya -->
        <g class="glows">
          <circle class="gl" cx="150" cy="114" r="44" fill="url(#g)" />
          <circle class="gl" cx="200" cy="104" r="44" fill="url(#g)" />
          <circle class="gl" cx="250" cy="114" r="44" fill="url(#g)" />
        </g>

        <!-- Batang lilin -->
        <rect x="142" y="140" width="16" height="62" rx="3" fill="url(#st)" stroke="#a33" stroke-width="1" />
        <rect x="192" y="130" width="16" height="72" rx="3" fill="url(#st)" stroke="#a33" stroke-width="1" />
        <rect x="242" y="140" width="16" height="62" rx="3" fill="url(#st)" stroke="#a33" stroke-width="1" />

        <!-- Api -->
        <g class="flameG" data-x="150" data-y="134" transform="translate(150 134)">
          <rect class="wick" x="-1" y="0" width="2" height="7" rx="1" fill="#2b1b14" />
          <g class="lean">
            <g class="flame" style="--fd:0.85s;--fdl:-0.2s">
              <g filter="url(#fBlur)">
                <path fill="url(#fOut)" d="M0 0C-8 -1 -11 -10 -7 -19C-4 -26 -1 -31 1 -40C5 -32 11 -25 10 -14C9 -6 6 0 0 0Z" />
                <ellipse cx="0" cy="-4" rx="5" ry="6" fill="#4d7cff" opacity=".5" />
                <path fill="url(#fIn)" d="M0 -2C-4 -3 -5 -9 -3 -14C-1 -18 0 -21 1 -25C3 -20 6 -16 5 -10C4 -5 3 -2 0 -2Z" />
              </g>
            </g>
          </g>
          <g class="ember">
            <circle r="9" fill="url(#eg)" />
            <circle r="1.5" cy=".5" fill="#ff9a3c" />
          </g>
        </g>
        <g class="flameG" data-x="200" data-y="124" transform="translate(200 124)">
          <rect class="wick" x="-1" y="0" width="2" height="7" rx="1" fill="#2b1b14" />
          <g class="lean">
            <g class="flame" style="--fd:0.7s;--fdl:-0.5s">
              <g filter="url(#fBlur)">
                <path fill="url(#fOut)" d="M0 0C-8 -1 -11 -10 -7 -19C-4 -26 -1 -31 1 -40C5 -32 11 -25 10 -14C9 -6 6 0 0 0Z" />
                <ellipse cx="0" cy="-4" rx="5" ry="6" fill="#4d7cff" opacity=".5" />
                <path fill="url(#fIn)" d="M0 -2C-4 -3 -5 -9 -3 -14C-1 -18 0 -21 1 -25C3 -20 6 -16 5 -10C4 -5 3 -2 0 -2Z" />
              </g>
            </g>
          </g>
          <g class="ember">
            <circle r="9" fill="url(#eg)" />
            <circle r="1.5" cy=".5" fill="#ff9a3c" />
          </g>
        </g>
        <g class="flameG" data-x="250" data-y="134" transform="translate(250 134)">
          <rect class="wick" x="-1" y="0" width="2" height="7" rx="1" fill="#2b1b14" />
          <g class="lean">
            <g class="flame" style="--fd:0.95s;--fdl:-0.1s">
              <g filter="url(#fBlur)">
                <path fill="url(#fOut)" d="M0 0C-8 -1 -11 -10 -7 -19C-4 -26 -1 -31 1 -40C5 -32 11 -25 10 -14C9 -6 6 0 0 0Z" />
                <ellipse cx="0" cy="-4" rx="5" ry="6" fill="#4d7cff" opacity=".5" />
                <path fill="url(#fIn)" d="M0 -2C-4 -3 -5 -9 -3 -14C-1 -18 0 -21 1 -25C3 -20 6 -16 5 -10C4 -5 3 -2 0 -2Z" />
              </g>
            </g>
          </g>
          <g class="ember">
            <circle r="9" fill="url(#eg)" />
            <circle r="1.5" cy=".5" fill="#ff9a3c" />
          </g>
        </g>

        <!-- Asap -->
        <g id="smokeLayer" style="pointer-events:none"></g>

        <!-- Area klik -->
        <rect id="hit" x="125" y="80" width="150" height="130" fill="transparent" />
      </g>

    </svg>

    <div class="hint" id="cakeHint">Klik lilinnya untuk meniupnya</div>
  </section>

  <section class="stage" id="giftStage">

    <svg id="gift" viewBox="0 0 300 300">

      <!-- Bayangan -->
      <ellipse cx="150" cy="268" rx="120" ry="12" fill="#000" opacity=".25" />

      <g id="giftWrap">

        <!-- Bagian dalam kotak -->
        <polygon id="inside" points="70,144 230,144 215,132 85,132" fill="#c26a05" />

        <!-- Badan kotak -->
        <rect x="70"  y="144" width="160" height="120" fill="#fcc43c" />
        <rect x="70"  y="144" width="40"  height="120" fill="#f5a623" opacity=".55" />
        <rect x="136" y="144" width="28"  height="120" fill="#e8591f" />

        <!-- Tutup + pita -->
        <g id="lid">
          <rect x="58"  y="112" width="184" height="34" rx="3" fill="#f5a623" />
          <rect x="136" y="112" width="28"  height="34" fill="#e8591f" />
          <path d="M150 112C120 70 80 78 92 104C104 122 138 116 150 112Z"   fill="#e8591f" />
          <path d="M150 112C180 70 220 78 208 104C196 122 162 116 150 112Z" fill="#f07c3a" />
          <circle cx="150" cy="110" r="9" fill="#c8400f" />
        </g>

      </g>
    </svg>

    <div class="hint" id="giftHint">Ada kado untukmu! Ketuk kadonya untuk membukanya.</div>
  </section>

  <section class="stage" id="cardStage">
    <img class="card-img" src="Hbd.png" alt="Kartu ucapan Happy Birthday">
  </section>

  <script src="script.js"></script>
</body>

</html>
